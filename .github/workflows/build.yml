name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm xorriso qemu-system-x86 ovmf gdb make curl

      - name: Host-side unit tests
        run: make -C tests/unit

      - name: Build ISO
        run: ./scripts/build.sh

      - name: QEMU boot smoke test
        run: ./scripts/run.sh test

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: quin-kernel-iso
          path: build/quin-kernel.iso
          retention-days: 7

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: quin-kernel-iso
          path: build

      - name: Attach ISO to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/quin-kernel.iso
